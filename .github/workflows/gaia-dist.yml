name: Gaia embedded build check

on:
  push:
    branches: [gaia]
  workflow_dispatch:

# Build check only. Releases are published from the Gaia checkout (scripts/publish-it-tools.mjs);
# the pub-forks org caps GITHUB_TOKEN at read-only.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build embedded distribution
        run: BASE_URL=/api/it-tools/app/ VITE_GAIA_EMBED=1 NODE_OPTIONS=--max_old_space_size=4096 pnpm exec vite build
      - name: Package distribution
        shell: bash
        run: |
          test -d dist
          test ! -e dist/sw.js
          if find dist -type f \( -name 'workbox-*.js' -o -name 'workbox-*.js.map' \) -print -quit | grep -q .; then
            echo 'Unexpected Workbox output in embedded distribution' >&2
            exit 1
          fi
          if find dist -type l -print -quit | grep -q .; then
            echo 'Symlinks are not allowed in the embedded distribution archive' >&2
            exit 1
          fi
          tar -C dist -czf it-tools-dist.tar.gz .
          sha256sum it-tools-dist.tar.gz > it-tools-dist.tar.gz.sha256
